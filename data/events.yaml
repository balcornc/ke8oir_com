# Events: one entry per dated occurrence. The Home and Events pages and the
# calendar (.ics) feed are all built from this file.
#
# SCHEMA (each event starts with a dash)
#   title:        (required) Event name.
#   start:        (required) New York local time. "YYYY-MM-DD HH:mm" (24-hour)
#                 for a timed event, or "YYYY-MM-DD" for an all-day event.
#   end:          (optional) Same format. For all-day events it is the LAST
#                 day, inclusive. For timed events it must be after start.
#   all_day:      (optional) true to force all-day even if start has a time.
#   type:         (optional) net | meeting | exam | field-day | special-event | other
#                 (default: other)
#   location:     (optional) Place name, e.g. "Middletown Library".
#   address:      (optional) Street address. Used for the map link.
#   map_url:      (optional) Explicit map link; overrides the address-based one.
#   description:  (optional) Plain text, a sentence or two.
#   link:         (optional) External URL for more info.
#   slug:         (optional) Links to a special event page at
#                 src/special-events/<slug>.md  ->  /special-events/<slug>/
#   updated:      (optional) YYYY-MM-DD. Set when you change an event so calendar
#                 apps notice. Also keeps the .ics feed deterministic.
#   sample:       (optional) true marks a placeholder. Samples show a "Sample" badge.
#
# TIMES are America/New_York wall-clock. Do NOT convert to UTC and do not worry
# about daylight saving: the build handles EST/EDT. Times that don't exist
# (the spring-forward gap) fail the build with a clear message.
#
# An event leaves the "upcoming" lists when its end passes (or, with no end,
# start + defaultEventHours; all-day events stay through their last day).
# Delete very old events from time to time to keep this file tidy.
#
# ALL ENTRIES BELOW ARE SAMPLES. Replace them with real events, and do not
# invent details: use [TODO: ...] until you have confirmed them.

