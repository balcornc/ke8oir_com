# Clubs, groups, and meeting places. Shown on the Local Info page.
#
# SCHEMA
#   name:          (required) Club or group name.
#   kind:          (optional) club | group | meetup | other  (default: club)
#   description:   (optional) One or two sentences for newcomers.
#   meeting_place: (optional) Where they meet, by name.
#   address:       (optional) Public street address of a PUBLIC meeting place only.
#                  Never a private home.
#   schedule:      (optional) e.g. "First Thursday, 7:00 PM". [TODO: ...] if unconfirmed.
#   website:       (optional) External URL.
#   contact:       (optional) Contact note (a public email or web form; no phone numbers).
#   verified:      (optional) "YYYY-MM" you last confirmed this entry.
#   sample:        (optional) true marks a placeholder.

- name: "DIAL Radio Club"
  kind: club
  description: "Radio club in Middletown, Ohio.  Hosts a weekly social net and monthly club meetings."
  meeting_place: "https://dialradioclub.org/calendar-upcoming-activities/"
  address: ""
  schedule: "3rd Monday, 5:30 PM dinner, 6:00 PM meeting"
  website: "https://dialradioclub.org"
  sample: false

